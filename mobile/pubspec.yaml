name: tetri
description: A sandbox multi-currency bank with a double-entry ledger.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  google_fonts: ^9.0.0
  intl: ^0.20.3
  uuid: ^4.6.0
  phosphor_glyphs: ^2.1.2+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/illustrations/
