name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - name: Restore
        run: dotnet restore backend/Tetri.sln --locked-mode
      - name: Build
        run: dotnet build backend/Tetri.sln --configuration Release --no-restore
      - name: Test against real PostgreSQL
        run: dotnet test backend/Tetri.sln --configuration Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - name: Verify Docker Compose startup and health
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up --build --detach --wait --wait-timeout 120
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 --output /tmp/tetri-health.json http://localhost:5080/api/v1/health
          jq -e '.status == "ok" and .database == "ok"' /tmp/tetri-health.json
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop Compose
        if: always()
        run: docker compose down
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
